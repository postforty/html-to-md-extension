<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>HTML to MD Saver 설정</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      max-width: 700px;
      margin: 0 auto;
      color: #333;
    }

    h1 {
      color: #FF5A00;
      border-bottom: 2px solid #E65100;
      padding-bottom: 10px;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    p {
      color: #555;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      outline: none;
      border-color: #FF5A00;
      box-shadow: 0 0 0 3px rgba(255, 90, 0, 0.15);
    }

    .input-group {
      display: flex;
    }

    .input-group input {
      border-radius: 6px 0 0 6px;
      border-right: none;
      margin-bottom: 0;
    }

    .input-group button {
      padding: 0 14px;
      background: #f8f9fa;
      color: #555;
      border: 1px solid #ccc;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .input-group button:hover {
      background: #e9ecef;
      color: #333;
    }

    #saveBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      background: linear-gradient(135deg, #FF5A00 0%, #E65100 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(230, 81, 0, 0.25);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    #saveBtn:hover {
      background: linear-gradient(135deg, #E65100 0%, #CC4800 100%);
      box-shadow: 0 4px 10px rgba(230, 81, 0, 0.35);
    }

    #saveBtn:active {
      transform: translateY(1px);
    }

    #status {
      margin-top: 15px;
      color: #107C10;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1 data-i18n="geminiSettings">Gemini API 설정</h1>
  <p data-i18n="geminiDesc">마크다운 번역 기능을 사용하려면 Gemini API Key가 필요합니다.</p>
  
  <div class="form-group">
    <label for="apiKey" data-i18n="apiKeyLabel">Gemini API Key:</label>
    <div class="input-group">
      <input type="password" id="apiKey" placeholder="AIzaSy...">
      <button type="button" id="toggleApiKey" title="비밀번호 표시/숨기기" data-i18n-title="toggleApiKeyTitle">
        <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path
            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
          </path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label for="geminiModel" data-i18n="geminiModelLabel">Gemini 모델 (Model):</label>
    <input type="text" id="geminiModel" placeholder="gemini-3.1-flash-lite" data-i18n-placeholder="geminiModelPlaceholder">
  </div>

  <div class="form-group">
    <label for="translateMode" data-i18n="defaultSaveModeLabel">기본 저장 방식:</label>
    <select id="translateMode">
      <option value="original" data-i18n="modeOriginal">원본만 저장</option>
      <option value="translated" data-i18n="modeTranslated">번역본만 저장</option>
      <option value="both" data-i18n="modeBoth">원본 + 번역본 저장</option>
    </select>
  </div>

  <div class="form-group">
    <label for="uiLanguage" data-i18n="uiLanguageLabel">UI 언어 (Language):</label>
    <select id="uiLanguage">
      <option value="auto" data-i18n="langAuto">시스템 기본값 (자동 감지)</option>
      <option value="ko" data-i18n="langKo">한국어 (Korean)</option>
      <option value="en" data-i18n="langEn">English</option>
    </select>
  </div>

  <button id="saveBtn" data-i18n="saveBtn">저장하기</button>
  <div id="status"></div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>

</html>
